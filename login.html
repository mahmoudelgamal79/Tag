<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sign in to your TAG account." />
  <title>Sign In — TAG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;500;600;700&family=Barlow:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=block"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=7" />
  <link rel="stylesheet" href="css/auth.css?v=5" />
  <link rel="stylesheet" href="css/rtl.css?v=5" />
  <script src="js/translate.js?v=5" defer></script>
</head>

<body>
  <div class="loader" id="loader">
    <div class="loader-mark">
      <img src="assets/images/logo-white.png" alt="TAG Logo">
    </div>
    <div class="loader-line"><span></span></div>
  </div>

  <!-- Custom Cursor -->
  <div class="cursor-ring" id="cursorRing">
    <div class="cursor-ring-inner"></div>
  </div>
  <div class="cursor-dot" id="cursorDot">
    <div class="cursor-dot-inner"></div>
  </div>

  <header class="navbar" id="navbar">
    <nav class="wrap navbar-inner">
      <!-- Logo -->
      <a href="index.html" class="navbar-logo">
        <img src="assets/images/tag-hero-mark.png" alt="TAG" class="navbar-logo-img" />
      </a>

      <!-- Mobile menu button -->
      <button class="navbar-mobile-btn" id="mobileMenuBtn" aria-label="Open menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" y1="8" x2="20" y2="8" />
          <line x1="4" y1="16" x2="20" y2="16" />
        </svg>
      </button>

      <!-- Center nav links -->
      <ul class="navbar-links">
        <li><a href="shop.html" class="nav-link">Shop</a></li>
        <li><a href="index.html#collection" class="nav-link">New In</a></li>
        <li><a href="index.html#lookbook" class="nav-link">Lookbook</a></li>
        <li><a href="contact.html" class="nav-link">Contact</a></li>
      </ul>

      <!-- Right actions -->
      <div class="navbar-actions">

        <!-- Expanding search (desktop) -->
        <div class="navbar-search-outer" id="searchArea">
          <div class="navbar-search-inner" id="searchInner">
            <button class="navbar-search-btn" id="searchToggleBtn" aria-label="Search">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
              </svg>
            </button>
            <input type="text" class="navbar-search-input" id="searchInput" placeholder="Search the collection\u2026" />
          </div>
        </div>

        <!-- Language toggle (EN / AR) -->
        <button class="navbar-lang-btn" type="button" data-lang-toggle aria-label="Switch language">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <span data-lang-label>AR</span>
        </button>

        <!-- Likes -->
        <a href="likes.html" class="navbar-icon-btn" aria-label="Wishlist">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
          </svg>
          <span class="navbar-badge" id="likesBadge" style="display:none;">0</span>
        </a>

        <!-- Cart -->
        <button class="navbar-icon-btn" id="cartToggleBtn" aria-label="Cart">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" />
            <line x1="3" y1="6" x2="21" y2="6" />
            <path d="M16 10a4 4 0 0 1-8 0" />
          </svg>
          <span class="navbar-badge" id="cartBadge" style="display:none;">0</span>
        </button>

        <!-- Profile -->
        <button class="navbar-icon-btn" id="navProfileBtn" aria-label="Profile">
          <span id="navProfileAvatar"></span>
        </button>
      </div>
    </nav>
  </header>

  <!-- Mobile Menu Overlay -->
  <div class="mobile-overlay" id="mobileOverlay">
    <div class="mobile-backdrop" id="mobileBackdrop"></div>
    <div class="mobile-drawer">
      <div class="mobile-drawer-header">
        <span class="mobile-drawer-logo">Tag</span>
        <button id="mobileCloseBtn" aria-label="Close menu" class="mobile-drawer-close">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
      <ul class="mobile-nav">
        <li><a href="shop.html">Shop</a></li>
        <li><a href="index.html#collection">New In</a></li>
        <li><a href="index.html#lookbook">Lookbook</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><button class="mobile-lang-btn" type="button" data-lang-toggle aria-label="Switch language"><span data-lang-label>AR</span></button></li>
      </ul>
      <div class="mobile-search">
        <div class="mobile-search-inner">
          <svg class="mobile-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <input type="text" placeholder="Search\u2026" />
        </div>
      </div>
    </div>
  </div>

  <div class="auth-page">

    <!-- Card -->
    <div class="auth-container">
      <div class="auth-card">
        <h1 class="auth-title">SIGN IN</h1>
        <p class="auth-subtitle">Welcome back to TAG</p>

        <form id="loginForm" novalidate>
          <!-- Email -->
          <div class="auth-field">
            <label class="auth-label" for="loginEmail">Email</label>
            <input type="email" id="loginEmail" class="auth-input" placeholder="you@example.com" autocomplete="email" />
            <p class="auth-error"></p>
          </div>

          <!-- Password -->
          <div class="auth-field">
            <label class="auth-label" for="loginPassword">Password</label>
            <div class="auth-input-wrapper">
              <input type="password" id="loginPassword" class="auth-input" placeholder="Enter your password" autocomplete="current-password" />
              <button type="button" class="auth-password-toggle" aria-label="Toggle password visibility">
                <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                  <line x1="1" y1="1" x2="23" y2="23" />
                  <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
                </svg>
              </button>
            </div>
            <p class="auth-error"></p>
          </div>

          <!-- Remember Me -->
          <div class="auth-checkbox-row">
            <input type="checkbox" id="rememberMe" class="auth-checkbox" />
            <label for="rememberMe" class="auth-checkbox-label">Remember me</label>
          </div>

          <!-- Submit -->
          <button type="submit" class="btn-white">Sign In</button>
        </form>

        <!-- Forgot Password -->
        <a href="forgot-password.html" class="auth-link auth-link-center auth-link-underline">Forgot Password?</a>

        <!-- Divider -->
        <div class="auth-divider">
          <span>or</span>
        </div>

        <!-- Create Account -->
        <a href="register.html" class="btn-outline">Create an Account</a>
      </div>
    </div>

    <!-- Footer -->
    <footer class="auth-footer">
      <p>&copy; 2026 TAG — Men's Streetwear. All rights reserved.</p>
    </footer>
  </div>

  <script src="js/products-data.js?v=5"></script>
  <script src="js/script.js?v=5"></script>
  <script src="js/api.js?v=6"></script>
  <script src="js/auth.js?v=5"></script>
  <script src="js/cursor.js?v=8"></script>
</body>

</html>
