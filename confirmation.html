      <ul class="mobile-nav">

        <li><button class="mobile-lang-btn" type="button" data-lang-toggle aria-label="Switch language"><span data-lang-label>AR</span></button></li>
      </ul>
      <div class="mobile-search">
        <div class="mobile-search-inner">
          <svg class="mobile-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">

  <div class="auth-page">

    <!-- Centered Content -->
    <div class="auth-container">
      <div style="max-width:540px;width:100%;text-align:center;">

        <!-- Checkmark Circle -->
        <div style="width:80px;height:80px;margin:0 auto 2rem;border:2px solid #6fcf97;border-radius:50%;display:flex;align-items:center;justify-content:center;">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#6fcf97" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>

        <!-- Title -->
        <h1 class="auth-title" style="font-size:2.75rem;">ORDER CONFIRMED</h1>
        <p class="auth-subtitle" style="margin-bottom:2.5rem;">Thank you for your purchase</p>

        <!-- Order Details Card -->
        <div class="checkout-order-summary" style="position:static;text-align:left;margin-bottom:1.5rem;">
          <div class="checkout-summary-title">ORDER DETAILS</div>

          <div id="confirmationDetails">
            <!-- Populated by JS -->
          </div>
        </div>

        <!-- Demo Note -->
          <p style="font-family:var(--font-sans);font-size:12px;color:var(--tag-500);margin-bottom:2rem;line-height:1.6;">
          Your order has been received. No online payment has been processed.
        </p>

        <!-- Continue Shopping -->
        <a href="index.html" class="btn-white">Continue Shopping</a>
      </div>
    </div>

    <!-- Footer -->
    <footer class="auth-footer">
      <p>&copy; 2026 TAG — Men's Streetwear. All rights reserved.</p>
    </footer>
  </div>

  <script src="js/api.js?v=5"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      var loader = document.getElementById('loader');
      if (loader) {
        window.addEventListener('load', function () {
          loader.classList.add('is-done');
          setTimeout(function () { loader.style.display = 'none'; }, 1000);
        });
        setTimeout(function () {
          loader.classList.add('is-done');
          setTimeout(function () {
            if (loader.style.display !== 'none') loader.style.display = 'none';
          }, 1000);
        }, 2500);
      }

      var params = new URLSearchParams(window.location.search);
      var orderId = params.get('orderId') || params.get('order');
      var email = sessionStorage.getItem('checkout_email') || '';
      var container = document.getElementById('confirmationDetails');

      function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, function (char) {
          return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[char];
        });
      }

      function renderError(message) {
        if (container) container.innerHTML = '<p style="color:var(--tag-400);">' + escapeHtml(message) + '</p>';
      }

      if (!orderId) {
        renderError('Order details are unavailable.');
        return;
      }

      try {
        var response = email
          ? await TAG.api.getOrder(orderId, email)
          : await TAG.api.trackOrder(orderId);
        var order = response && response.order;
        if (!order) throw new Error('Order not found');

        var itemCount = (order.items || []).reduce(function (sum, item) {
          return sum + Number(item.quantity || 1);
        }, 0);
        var paymentLabels = { cod: 'Cash on Delivery', card: 'Card', 'vodafone-cash': 'Vodafone Cash' };
        var paymentLabel = paymentLabels[order.paymentMethod] || order.paymentMethod || 'Cash on Delivery';
        var html = '';
        html += '<div class="checkout-summary-row"><span style="color:var(--tag-400);">Order ID</span><span style="font-family:var(--font-mono);color:var(--tag-white);">' + escapeHtml(order.id) + '</span></div>';
        html += '<div class="checkout-summary-row"><span style="color:var(--tag-400);">Date</span><span style="color:var(--tag-200);">' + escapeHtml(order.date || order.createdAt || '') + '</span></div>';
        html += '<div class="checkout-summary-row"><span style="color:var(--tag-400);">Items</span><span style="color:var(--tag-200);">' + itemCount + ' item(s)</span></div>';
        (order.items || []).forEach(function (item) {
          html += '<div class="checkout-summary-item" style="padding:0.5rem 0;border-bottom:1px solid rgba(255,255,255,0.06);">';
          html += '<div style="flex:1;min-width:0;"><p class="checkout-summary-item-name">' + escapeHtml(item.name || 'Product') + '</p>';
          html += '<p class="checkout-summary-item-qty">Qty: ' + Number(item.quantity || 1) + '</p></div>';
          html += '<span class="checkout-summary-item-price">' + Number(item.price || 0).toFixed(2) + ' EGP</span></div>';
        });
        html += '<div class="checkout-summary-row"><span style="color:var(--tag-400);">Shipping</span><span style="color:var(--tag-200);">' + Number(order.shipping || 0).toFixed(2) + ' EGP</span></div>';
        html += '<div class="checkout-summary-row"><span style="color:var(--tag-400);">Payment</span><span style="color:var(--tag-200);">' + escapeHtml(paymentLabel) + '</span></div>';
        html += '<div class="checkout-summary-total"><span>Total</span><span>' + Number(order.total || 0).toFixed(2) + ' EGP</span></div>';
        if (container) container.innerHTML = html;
        sessionStorage.removeItem('checkout_email');
      } catch (error) {
        console.error('Confirmation order lookup failed:', error);
        renderError('Unable to load this order. Please use the order number to track it.');
      }
    });
  </script>
  <script src="js/products-data.js?v=5"></script>
  <script src="js/script.js?v=5"></script>
  <script src="js/cursor.js?v=8"></script>
</body>
